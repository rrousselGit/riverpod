name: workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - benchmarks
  - examples/first_app
  - examples/counter
  - examples/marvel
  - examples/pub
  - examples/random_number
  - examples/stackoverflow
  - examples/todos
  - packages/flutter_riverpod/example
  - packages/flutter_riverpod
  - packages/hooks_riverpod/example
  - packages/hooks_riverpod
  - packages/lint_visitor_generator
  - packages/internal_lint
  - packages/riverpod/example
  - packages/riverpod
  - packages/riverpod_analyzer_utils
  - packages/riverpod_analyzer_utils_tests
  - packages/riverpod_annotation
  - packages/riverpod_lint_flutter_test
  - packages/riverpod_generator/integration/build_yaml
  - packages/riverpod_generator
  - packages/riverpod_devtool
  - packages/riverpod_devtool_generator
  - packages/riverpod_lint
  # Custom_lint doesn't handle plugins from workspaces yet
  # - packages/riverpod_lint_flutter_test
  - packages/riverpod_sqflite/example
  - packages/riverpod_sqflite
  - tools/generate_providers
  - tools/package_graph
  - other_projects/devtool_debug_app
  - website

dependency_overrides:
  # source_helper 1.4.0 adds extensions that clash with json_serializable
  # 6.15.0's, which then fails to compile. Remove once either is fixed.
  source_helper: ">=1.3.10 <1.4.0"
