name: riverpod_devtool_core
description: >
  The logic behind Riverpod's devtool: talks to a running application through
  the Dart VM service, without depending on Flutter.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  characters: ^1.4.0
  collection: ^1.19.1
  meta: ^1.17.0
  riverpod: 3.5.0
  stack_trace: ^1.12.1
  vm_service: ^15.0.2

dev_dependencies:
  build_runner: ^2.11.0
  fake_async: ^1.3.3
  mockito: ^5.5.1
  path: ^1.9.0
  riverpod_devtool_generator: ^0.0.0
  test: ^1.25.0
