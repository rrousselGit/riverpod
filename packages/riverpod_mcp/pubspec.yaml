name: riverpod_mcp
description: >
  An MCP server that lets AI agents inspect the providers of a running
  Riverpod application, like Riverpod's devtool does for humans.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

executables:
  riverpod_mcp:

dependencies:
  collection: ^1.19.1
  dart_mcp: ^0.5.2
  meta: ^1.17.0
  riverpod: 3.5.0
  riverpod_devtool_core: ^0.0.0
  stack_trace: ^1.12.1
  vm_service: ^15.0.2

dev_dependencies:
  stream_channel: ^2.1.4
  test: ^1.25.0
