name: doc_snippets
description: Extracts the Dart snippets of the docs into snippets/, so that they are analyzed and can be tested.
publish_to: "none"

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  analyzer: ">=13.0.0 <15.0.0"
  # What the extracted snippets import, besides the packages of this
  # repository.
  collection: ^1.15.0
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  flutter_riverpod:
  flutter_test:
    sdk: flutter
  glob: ^2.1.2
  hooks_riverpod:
  http: ^1.3.0
  material_ui: ^1.0.0
  meta: ^1.15.0
  mockito: ^5.0.0
  path: ^1.8.1
  riverpod:
  riverpod_annotation:
  riverpod_devtool_core:
  riverpod_sqflite:
  sqflite: ^2.4.2
  test: ^1.24.9
  vm_service: ">=14.0.0 <16.0.0"
  yaml: ^3.1.0

