# How many mutants of each lib/ file of packages/riverpod its own test let
# survive when mutation testing was added. A mutant is a small change to the
# code, such as `>` to `>=`; it survives when the test of its file, the
# test/src/**/x_test.dart of lib/src/**/x.dart, still passes. Only that test
# runs: one that catches the mutant from another file does not count.
#
# Enforced on every file daily by scripts/mutation.sh --all, and on the files
# a change touches, or whose test it touches, by --whole-files. Pull requests
# only run the mutants on the lines they change, none of which may survive.
# Do not add to these counts: make the test kill the new mutants. Lower an
# entry once its file has fewer survivors (the daily check fails until you
# do), which `scripts/mutation.sh --update-baseline` does.
# Paths are relative to the repository root.
