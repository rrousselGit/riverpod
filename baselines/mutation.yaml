# The mutants of each lib/ file of packages/riverpod that its own test lets
# survive. A mutant is a small change to the code, such as `>` to `>=`; it
# survives when the test of its file, the test/src/**/x_test.dart of
# lib/src/**/x.dart, still passes. Only that test runs: one that catches the
# mutant from another file does not count.
#
# A mutant is named by the declaration it is in, its mutator, and the code
# it replaces and its replacement (shortened), so that its entry stays the
# same while the code around it moves. It is listed once per such mutant.
#
# Enforced by scripts/mutation.sh: pull requests run the mutants on the
# lines they change, and every mutant runs daily. A mutant that survives
# must be listed here, and one listed here must still survive, as far as
# the run can tell. Do not add entries: make the test kill the new mutants.
# `scripts/mutation.sh --update-baseline` removes the entries of mutants
# that no longer survive.
# Paths are relative to the repository root.
