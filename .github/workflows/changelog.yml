name: Check CHANGELOG.md

# Separate from ci.yml because it must also run on Markdown-only changes
# (CHANGELOG.md itself is Markdown, which ci.yml ignores).

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - run: scripts/check.sh changelog
