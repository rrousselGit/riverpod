name: PR 4884 targeted validation

on:
  push:
    branches:
      - fix-ticker-mode-diamond-resume

permissions:
  contents: write

jobs:
  flutter-riverpod-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          channel: master
      - run: flutter pub get
      - name: Run targeted regression tests
        working-directory: packages/flutter_riverpod
        run: flutter test test/src/core/provider_element_test.dart
      - name: Add changelog and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/flutter_riverpod/CHANGELOG.md')
          original = path.read_text()
          entry = (
              '## Unreleased fix\n\n'
              '- Fix a `setState() or markNeedsBuild() called during build` error '
              'when resuming a consumer with a diamond-shaped provider dependency '
              'graph. (thanks to @yazanmg)\n\n'
          )
          if not original.startswith('## Unreleased fix\n'):
              path.write_text(entry + original)
          PY

          git config user.name "Yazan Arafeh"
          git config user.email "32390922+yazanmg@users.noreply.github.com"
          git rm .github/workflows/pr4884-validation.yml
          git add packages/flutter_riverpod/CHANGELOG.md
          git commit -m "Add changelog for resumed dependency refresh fix"
          git push origin HEAD:fix-ticker-mode-diamond-resume
