# Where the legacy APIs may be used: StateProvider, StateNotifierProvider,
# ChangeNotifierProvider, package:state_notifier, and the legacy.dart
# libraries that export them. Modern Riverpod uses Notifier/NotifierProvider.
#
# Enforced by:
# - the avoid_legacy_api lint of packages/internal_lint, on the Dart files
#   whose analysis_options.yaml enable internal_lint (scripts/analyze.sh);
# - scripts/legacy.sh, on everything else: pubspec.yaml, ```dart blocks of
#   Markdown files, and the Dart files the lint does not analyze, read as
#   text. It also forbids silencing the lint, with an `ignore` comment or in
#   an analysis_options.yaml.
# Paths are relative to the repository root.

# Globs of the files that are not checked at all. Translations of the docs
# follow the English docs, which are checked.
ignored:
  - website/i18n/**

# Globs of the files that may always use legacy APIs: their implementation,
# their tests, and the guides to migrate away from them.
allowed:
  - packages/riverpod/lib/legacy.dart
  - packages/flutter_riverpod/lib/legacy.dart
  - packages/hooks_riverpod/lib/legacy.dart
  - packages/riverpod/lib/src/providers/legacy/**
  - packages/flutter_riverpod/lib/src/providers/legacy/**
  - packages/riverpod/test/src/providers/legacy/**
  - packages/flutter_riverpod/test/src/providers/legacy/**
  - "{packages/riverpod,packages/flutter_riverpod,packages/hooks_riverpod}/pubspec.yaml"
  # The libraries that wire the legacy providers into the rest of the API:
  # their `.family`/`.autoDispose` builders and the internal exports.
  - packages/riverpod/lib/src/_internals.dart
  - packages/riverpod/lib/src/builder.dart
  - packages/riverpod/lib/src/internals.dart
  - packages/flutter_riverpod/lib/misc.dart
  - packages/flutter_riverpod/lib/src/builders.dart
  - packages/flutter_riverpod/lib/src/internals.dart
  - packages/hooks_riverpod/lib/misc.dart
  - packages/hooks_riverpod/lib/src/internals.dart
  - packages/riverpod_annotation/lib/src/internal.dart
  # The unsupported_provider_value lint rejects legacy notifiers.
  - packages/riverpod_lint/README.md
  - packages/riverpod_lint_flutter_test/test/lints/unsupported_provider_value.dart
  - packages/riverpod_lint_flutter_test/test/lints/unsupported_provider_value.g.dart
  - "**/CHANGELOG.md"
  - website/docs/migration/**
  - website/docs/3.0_migration.mdx
  - website/docs/whats_new.mdx

# The files that used legacy APIs when this policy was added. Do not add to
# this list: use Notifier/NotifierProvider instead. Remove an entry once its
# file no longer uses legacy APIs (the checks fail until you do).
baseline:
  - website/docs/from_provider/provider_vs_riverpod.mdx
  - website/docs/from_provider/quickstart.mdx
  - website/docs/root/do_dont.mdx
